[package]
name = "winllama"
version = "0.1.0"
edition = "2021"
description = "Winllama CLI: thin HTTP client for the local OpenVINO GenAI daemon (ADR-0004)."
license = "MIT"

[[bin]]
name = "winllama"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "process", "time", "signal", "io-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
dirs = "5.0"
